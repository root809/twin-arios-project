<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Twin Arios Rumah Jahit</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style id="st">
:root{--bg:#F1F4F8;--ink:#1B2540;--mut:#566079;--card:#fff;--line:#D5DBE6;--tape:#F0C419;--wa:#168A4A;--on-wa:#fff;--hl:#E7EDF8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12172A;--ink:#EDEFF6;--mut:#A3ACC4;--card:#1B2240;--line:#2C3558;--hl:#232C50;--wa:#2BB566;--on-wa:#08210F}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12172A;--ink:#EDEFF6;--mut:#A3ACC4;--card:#1B2240;--line:#2C3558;--hl:#232C50;--wa:#2BB566;--on-wa:#08210F}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 Figtree,system-ui,sans-serif}
h1,h2{font-family:"Young Serif",Georgia,serif;font-weight:400;line-height:1.15;margin:0}
.tape{height:30px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 80px),repeating-linear-gradient(90deg,var(--ink) 0 1px,transparent 1px 8px) bottom/100% 45% no-repeat,var(--tape)}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}
.hero{padding:44px 0 36px}
.hero h1{font-size:clamp(2.3rem,8vw,4rem);max-width:12ch}
.hero p{font-size:1.15rem;color:var(--mut);max-width:34em;margin:14px 0 24px;white-space:pre-line}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:10px;font:600 1rem Figtree,sans-serif;text-decoration:none;border:2px solid var(--ink);color:var(--ink);background:transparent;cursor:pointer}
.btn.wa{background:var(--wa);border-color:var(--wa);color:var(--on-wa)}
.btn:focus-visible,.ed:focus-visible,input:focus-visible{outline:3px solid var(--tape);outline-offset:2px}
section{padding:34px 0;border-top:1px solid var(--line)}
section h2{font-size:1.7rem;margin-bottom:16px}
.desc{white-space:pre-line;max-width:38em}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 16px;padding:12px 0;border-bottom:1px dashed var(--line);align-items:baseline}
.row .n{font-weight:600}.row .s{color:var(--mut);font-size:.92rem;grid-column:1}.row .p{font-weight:700;grid-row:1;grid-column:2;text-align:right}
.row .x{grid-column:2;justify-self:end}
.tg{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;position:relative}
.card q{display:block;quotes:"“" "”";margin-bottom:10px}.card b{color:var(--mut);font-weight:600;font-size:.95rem}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 18px}dt{color:var(--mut)}dd{margin:0;white-space:pre-line}
a{color:inherit}
footer{padding:30px 0 120px;color:var(--mut);font-size:.9rem;border-top:1px solid var(--line)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:5;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.bar{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;gap:8px;flex-wrap:wrap;max-width:calc(100% - 190px)}
.bar .btn{background:var(--card);padding:10px 14px}.bar .btn.on{background:var(--tape);border-color:var(--ink);color:#1B2540}
.ed{outline:1.5px dashed var(--mut);outline-offset:3px;border-radius:3px;min-height:1.2em;cursor:text}
.ed:empty::before{content:attr(data-ph);color:var(--mut)}
.mini{font:600 .85rem Figtree,sans-serif;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer;margin-top:8px}
.set{display:grid;gap:10px;background:var(--hl);border-radius:12px;padding:16px;margin-bottom:16px}
.set label{display:grid;gap:3px;font-size:.88rem;color:var(--mut)}
.set input{font:400 1rem Figtree,sans-serif;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.msg{font-size:.9rem;margin:8px 0 0;color:var(--mut)}
</style></head><body><div id="app"></div>
<script id="data" type="application/json">{"name":"Twin Arios Rumah Jahit","tagline":"Jahit baju, permak, dan perbaikan pakaian yang rapi, pas di badan, dan selesai tepat waktu.","desc":"Twin Arios Rumah Jahit melayani jahit baju sesuai ukuran, permak, dan perbaikan pakaian untuk keluarga Anda.\nCeritakan kebutuhan Anda lewat WhatsApp, kami bantu dari pengukuran sampai baju siap dipakai.\n(Klik teks ini di mode edit untuk mengganti deskripsi.)","wa":"628131392905","waText":"Halo Twin Arios Rumah Jahit, saya mau tanya soal jahitan.","alamat":"Isi alamat lengkap di mode edit","jam":"Senin–Sabtu, 09.00–17.00","email":"","ig":"","maps":"https://share.google/OjMe9P8sVr6AqlPti","prices":[{"item":"Permak celana (potong kaki)","note":"Contoh, ganti dengan layanan Anda","price":"Rp 25.000"},{"item":"Ganti resleting","note":"","price":"Rp 20.000"},{"item":"Jahit kemeja","note":"Bahan dari pelanggan","price":"Rp 150.000"},{"item":"Jahit kebaya","note":"Harga tergantung model","price":"Mulai Rp 350.000"}],"testi":[{"name":"Nama pelanggan","text":"Contoh testimoni. Ganti dengan testimoni asli dari pelanggan Anda."},{"name":"Nama pelanggan","text":"Contoh testimoni kedua. Hasil jahitan rapi dan pas."}]}</script>
<script id="js">
const FONT="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;600;700&display=swap";
let DATA=JSON.parse(document.getElementById("data").textContent),SNAP=JSON.stringify(DATA),editing=false,canEdit=false,msg="";
const app=document.getElementById("app");
const $=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
function ed(tag,cls,o,k,ph){const e=$(tag,cls,o[k]);if(editing){try{e.contentEditable="plaintext-only"}catch(x){}if(e.contentEditable!=="plaintext-only")e.contentEditable="true";e.dataset.ph=ph;e.classList.add("ed");e.oninput=()=>{o[k]=e.textContent}}return e}
function waLink(){let d=String(DATA.wa||"").replace(/\D/g,"");if(d.startsWith("0"))d="62"+d.slice(1);return"https://wa.me/"+d+"?text="+encodeURIComponent(DATA.waText||"")}
function mapLink(){const m=String(DATA.maps||"").trim();return/^https?:\/\//i.test(m)?m:"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(DATA.alamat||DATA.name)}
function link(cls,href,txt){const a=$("a","btn "+cls,txt);a.href=href;a.target="_blank";a.rel="noopener";return a}
function btn(txt,fn,cls){const b=$("button",cls||"mini",txt);b.type="button";b.onclick=fn;return b}
function sec(id,title){const s=$("section");s.id=id;s.appendChild($("h2",null,title));return s}
function render(){
 app.textContent="";document.title=DATA.name;
 app.appendChild($("div","tape"));
 const w=$("div","wrap");app.appendChild(w);
 const h=$("div","hero");h.append(ed("h1","",DATA,"name","Nama usaha"),ed("p","",DATA,"tagline","Kalimat pembuka"));
 const b=$("div","btns");b.append(link("wa",waLink(),"Chat WhatsApp"),link("",mapLink(),"Lihat di Google Maps"));h.appendChild(b);w.appendChild(h);
 let s=sec("tentang","Tentang kami");s.appendChild(ed("p","desc",DATA,"desc","Deskripsi usaha"));w.appendChild(s);
 s=sec("harga","Daftar harga");
 DATA.prices.forEach((p,i)=>{const r=$("div","row");r.append(ed("div","n",p,"item","Nama layanan"),ed("div","p",p,"price","Harga"));
  if(editing){r.append(ed("div","s",p,"note","Catatan (opsional)"),btn("Hapus",()=>{DATA.prices.splice(i,1);render()},"mini x"))}else if(p.note)r.appendChild($("div","s",p.note));
  s.appendChild(r)});
 if(editing)s.appendChild(btn("+ Tambah layanan",()=>{DATA.prices.push({item:"",note:"",price:""});render()}));
 w.appendChild(s);
 s=sec("testimoni","Kata pelanggan");const g=$("div","tg");
 DATA.testi.forEach((t,i)=>{const c=$("div","card");c.append(ed("q","",t,"text","Isi testimoni"),ed("b","",t,"name","Nama pelanggan"));
  if(editing)c.appendChild(btn("Hapus",()=>{DATA.testi.splice(i,1);render()}));g.appendChild(c)});
 s.appendChild(g);if(editing)s.appendChild(btn("+ Tambah testimoni",()=>{DATA.testi.push({name:"",text:""});render()}));w.appendChild(s);
 s=sec("kontak","Kontak & lokasi");
 if(editing){const f=$("div","set");[["wa","Nomor WhatsApp (contoh 6281234567890)"],["waText","Pesan otomatis saat tombol WA diklik"],["alamat","Alamat"],["jam","Jam buka"],["email","Email (opsional)"],["ig","Instagram (opsional)"],["maps","Link Google Maps (tempel dari tombol Bagikan di Google Maps)"]].forEach(([k,l])=>{const lb=$("label",null,l),i=$("input");i.value=DATA[k]||"";i.oninput=()=>{DATA[k]=i.value};lb.appendChild(i);f.appendChild(lb)});s.appendChild(f)}
 else{const d=$("dl");[["WhatsApp","wa"],["Alamat","alamat"],["Jam buka","jam"],["Email","email"],["Instagram","ig"]].forEach(([l,k])=>{if(DATA[k]){d.append($("dt",null,l),$("dd",null,k==="wa"?"+"+String(DATA.wa).replace(/\D/g,""):DATA[k]))}});s.appendChild(d);
  const bb=$("div","btns");bb.style.marginTop="18px";bb.append(link("wa",waLink(),"Chat WhatsApp"),link("",mapLink(),"Buka di Google Maps"));s.appendChild(bb)}
 w.appendChild(s);
 const ft=$("footer");ft.appendChild($("div","wrap","© "+new Date().getFullYear()+" "+DATA.name));app.appendChild(ft);
 if(!editing)app.appendChild(link("wa fab",waLink(),"WhatsApp"));
 if(canEdit){const bar=$("div","bar");
  if(!editing)bar.appendChild(btn("Edit halaman",()=>{editing=true;msg="";render()},"btn"));
  else{bar.append(btn("Simpan & publikasikan",save,"btn on"),btn("Batal",()=>{DATA=JSON.parse(SNAP);editing=false;render()},"btn"));if(msg)bar.appendChild($("p","msg",msg))}
  app.appendChild(bar)}
}
function buildDoc(){
 const css=document.getElementById("st").textContent,js=document.getElementById("js").textContent,data=JSON.stringify(DATA).replace(/</g,"\\u003c");
 return'<!doctype html>\n<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>'+esc(DATA.name)+'</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="'+FONT+'" rel="stylesheet"><style id="st">'+css+'</style></head><body><div id="app"></div><script id="data" type="application/json">'+data+'<\/script><script id="js">'+js+'<\/script></body></html>';
}
async function save(){
 try{msg="Menyimpan…";render();const a=await claude.use("artifact");if(!a)throw new Error("tidak tersedia");await a.publish(buildDoc())}
 catch(e){msg="Gagal menyimpan: "+((e&&(e.code||e.message))||"coba lagi");render()}
}
render();
(async()=>{try{if(window.claude&&claude.use){const u=await claude.use("user");if(u&&u.canEdit()){canEdit=true;render()}}}catch(e){}})();
</script>
</body></html>
